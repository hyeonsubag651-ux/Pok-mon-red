<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>포켓몬스터 레전드 로그라이크</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'DungGeunMo','Courier New',monospace}
body{background:#202020;color:#101010;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:12px}
#game-container{width:100%;max-width:600px;background:#f8f8f8;border:4px solid #303030;border-radius:12px;overflow:hidden}
header{background:#cc0000;color:white;text-align:center;padding:15px;font-size:1.3rem;font-weight:bold}
#floor-display{background:#303030;color:white;text-align:center;padding:10px;font-weight:bold}
#screen{padding:20px;background:linear-gradient(#e0f7fa,#fff);min-height:250px;display:flex;flex-direction:column;justify-content:space-between;border-bottom:4px solid #303030;gap:20px}
.status-box{background:#f8f9fa;border:3px solid #303030;border-radius:8px;padding:10px 15px;width:85%;box-shadow:3px 3px 0 #888}
.opponent{align-self:flex-start}.player{align-self:flex-end}
.pokemon-info{display:flex;justify-content:space-between;font-weight:bold;margin-bottom:6px;gap:8px}
.hp-bar-outer{width:100%;height:16px;background:#e0e0e0;border:2px solid #303030;border-radius:8px;overflow:hidden}
.hp-bar-inner{height:100%;width:100%;background:#4caf50;transition:width .3s}
.hp-text{text-align:right;font-size:.85rem;margin-top:4px;font-weight:bold}
#log-box{min-height:100px;max-height:160px;background:#2b2b2b;color:white;padding:12px 16px;font-size:.95rem;line-height:1.5;border-bottom:4px solid #303030;overflow-y:auto;white-space:pre-wrap}
#info{padding:10px;background:#e9e9e9;border-bottom:2px solid #333;font-size:.85rem;line-height:1.7}
#controls{padding:15px;background:#f0f0f0;min-height:150px}
.btn-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{padding:12px 8px;font-size:1rem;font-weight:bold;background:white;border:3px solid #303030;border-radius:6px;cursor:pointer;box-shadow:2px 2px 0 #303030}
button:active:not(:disabled){transform:translate(1px,1px);box-shadow:none}
button:disabled{background:#ccc;color:#777;cursor:not-allowed}
input{width:100%;padding:12px;font-size:1rem;border:3px solid #303030;border-radius:6px}
.hidden{display:none!important}.full{grid-column:span 2}
#party-list{display:grid;gap:8px}
.save-controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px;background:#ddd}
.save-controls button{font-size:.85rem;padding:9px 5px}
#save-status{text-align:center;background:#eee;padding:6px;font-size:.8rem;color:#333}
.small{font-size:.78rem;color:#555;text-align:center;padding:5px}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input{-webkit-user-select:text;user-select:text}
#cheat-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;justify-content:center;align-items:center;z-index:999;padding:16px}
#cheat-panel{width:100%;max-width:420px;max-height:80vh;background:#f8f8f8;border:4px solid #303030;border-radius:12px;display:flex;flex-direction:column;overflow:hidden}
#cheat-panel h3{background:#303030;color:#fff;text-align:center;padding:12px}
#cheat-list{padding:12px;overflow-y:auto;display:grid;gap:8px;min-height:80px}
.cheat-row{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid #303030;border-radius:6px;padding:8px 10px;font-size:.9rem}
.cheat-row input{width:22px;height:22px;padding:0;flex:none}
.cheat-row .cheat-name{flex:1;line-height:1.3}
.cheat-row button{padding:4px 8px;font-size:.8rem;flex:none}
#cheat-add{margin:0 12px 10px;font-size:1.6rem;padding:4px}
#cheat-close{margin:0 12px 12px}
</style>
</head>
<body>
<div id="game-container">
<header>⚡ POKÉMON ROGUELIKE ⚡</header>
<div id="floor-display">🏰 준비 중</div>
<div id="screen">
<div class="status-box opponent">
<div class="pokemon-info"><span id="opp-name">야생 포켓몬</span><span id="opp-level">Lv.?</span></div>
<div class="hp-bar-outer"><div id="opp-hp-bar" class="hp-bar-inner"></div></div>
<div class="hp-text" id="opp-hp-text">--/--</div>
</div>
<div class="status-box player">
<div class="pokemon-info"><span id="player-pkmn-name">내 포켓몬</span><span id="player-level">Lv.?</span></div>
<div class="hp-bar-outer"><div id="player-hp-bar" class="hp-bar-inner"></div></div>
<div class="hp-text" id="player-hp-text">--/--</div>
</div>
</div>
<div id="info">🎒 아이템: 준비 중</div>
<div id="log-box">이름을 입력하고 모험을 시작하세요!</div>
<div id="save-status">💾 저장 데이터 확인 중...</div>
<div class="save-controls">
<button onclick="manualSave()">💾 수동 저장</button>
<button onclick="resetSave()">🗑️ 세이브 리셋</button>
</div>
<div class="small">전국도감 1~1025 지원 · 전 세대 기술 연동 · 100층마다 전설 포켓몬 보스</div>
<div id="controls">
<div id="setup-name" class="btn-grid">
<input id="player-name-input" class="full" maxlength="10" placeholder="주인공 이름 (기본값: 카이)">
<button class="full" onclick="submitName()">모험 시작</button>
</div>
<div id="setup-starter" class="btn-grid hidden">
<button onclick="selectStarter(1)">이상해씨 🌱</button>
<button onclick="selectStarter(4)">파이리 🔥</button>
<button onclick="selectStarter(7)">꼬부기 💧</button>
<button onclick="selectStarter(25)">피카츄 ⚡</button>
</div>
<div id="action-menu" class="btn-grid hidden">
<button onclick="showMoveMenu()">⚔️ 싸운다</button>
<button onclick="catchPokemon()">🎯 포획하기</button>
<button onclick="useItem()">🎒 아이템</button>
<button onclick="showParty(false)">🔁 포켓몬 교체</button>
<button class="full" onclick="runAway()">🏃 도망치기</button>
</div>
<div id="move-menu" class="btn-grid hidden">
<button id="move-btn-0" onclick="playerAttack(0)">-</button>
<button id="move-btn-1" onclick="playerAttack(1)">-</button>
<button id="move-btn-2" onclick="playerAttack(2)">-</button>
<button id="move-btn-3" onclick="playerAttack(3)">-</button>
<button class="full" onclick="showSection('action-menu')">뒤로</button>
</div>
<div id="party-menu" class="hidden">
<div id="party-list"></div>
<button id="party-back" class="full" style="width:100%;margin-top:10px" onclick="showSection('action-menu')">뒤로</button>
</div>
<div id="restart-menu" class="btn-grid hidden">
<button class="full" onclick="restartGame()">다시 도전하기 (파티 전원 회복)</button>
</div>
</div>
</div>
<div id="cheat-overlay" class="hidden">
<div id="cheat-panel">
<h3>🛠️ 치트</h3>
<div id="cheat-list"></div>
<button id="cheat-add" onclick="addCheat()">+</button>
<button id="cheat-close" onclick="closeCheat()">닫기</button>
</div>
</div>

async function fetchJson(url){var r=await fetch(url);if(!r.ok)throw new Error("데이터 요청 실패 "+r.status);return await r.json();}

async function resolveMoveInfo(apiMove){
var key=apiMove.move.name;
if(moveCache[key])return moveCache[key];
try{
var mData=await fetchJson(apiMove.move.url);
if(typeof mData.power!=="number"||mData.power<=0){moveCache[key]=null;return null;}
var koNameObj=mData.names.find(function(n){return n.language.name==="ko";});
var koName=koNameObj?koNameObj.name:key;
var koType=TYPE_KO[mData.type&&mData.type.name]||"노말";
var info={name:koName,type:koType,power:mData.power};
moveCache[key]=info;
return info;
}catch(e){return null;}
}

async function extractLearnedMoves(rawMoves,allowedTypes){
var result={};
if(!Array.isArray(rawMoves)||!rawMoves.length)return result;
var candidates=rawMoves.slice().sort(function(){return Math.random()-0.5;});
var checked=0;
for(var i=0;i<candidates.length&&checked<45;i++){
var info=await resolveMoveInfo(candidates[i]);
checked++;
if(!info||!info.name)continue;
if(allowedTypes.indexOf(info.type)<0)continue;
if(!result[info.name]){
MOVES[info.name]=[info.type,info.power];
result[info.name]=[info.type,info.power];
}
if(Object.keys(result).length>=4)break;
}
writeCache();
return result;
}

async function getPokemonData(id){
id=Number(id);if(id<1||id>1025)throw new Error("도감 번호 오류");
if(dexCache[id])return dexCache[id];
var raw=await fetchJson(API+"pokemon/"+id);
var species=await fetchJson(API+"pokemon-species/"+id);
var korean=species.names.find(function(n){return n.language.name==="ko";});
var types=raw.types.sort(function(a,b){return a.slot-b.slot;}).map(function(t){return TYPE_KO[t.type.name]||"노말";});
var type1=types[0]||"노말",type2=types[1]||null;
var allowedTypes=type2?[type1,type2]:[type1];
var stats={};raw.stats.forEach(function(s){stats[s.stat.name]=s.base_stat;});
var learnedMoves=await extractLearnedMoves(raw.moves,allowedTypes);
var data={dexNo:id,name:korean?korean.name:(raw.name),type1:type1,type2:type2,hp:stats.hp||50,attack:stats.attack||50,defense:stats.defense||50,legendary:!!species.is_legendary,mythical:!!species.is_mythical,learnedMoves:learnedMoves};
dexCache[id]=data;writeCache();return data;
}

class Pokemon{
constructor(data,level){
this.dexNo=data.dexNo;this.name=data.name;this.type1=data.type1;this.type2=data.type2;
this.level=level||10;
this.maxHp=Math.floor(data.hp*2*this.level/100)+this.level+10;
this.hp=this.maxHp;
this.attack=Math.floor(data.attack*2*this.level/100)+5;
this.defense=Math.floor(data.defense*2*this.level/100)+5;
this.legendary=!!data.legendary;this.mythical=!!data.mythical;
this.learnedMoves=data.learnedMoves||{};
this.moves=this.assignMoves();
}
assignMoves(){
var a={};
var allowedTypes=this.type2?[this.type1,this.type2]:[this.type1];
var self=this;
Object.keys(this.learnedMoves).forEach(function(n){
var m=self.learnedMoves[n];
if(m&&allowedTypes.indexOf(m[0])>=0&&Object.keys(a).length<4){a[n]=m;}
});
allowedTypes.forEach(function(t){
var pool=TYPE_MOVES[t]||[];
pool.forEach(function(n){
if(Object.keys(a).length<4&&MOVES[n]&&allowedTypes.indexOf(MOVES[n][0])>=0&&!a[n]){a[n]=MOVES[n];}
});
});
allowedTypes.forEach(function(t){
var n=TYPE_MOVE[t];
if(n&&MOVES[n]&&Object.keys(a).length<4&&!a[n])a[n]=MOVES[n];
});
if(!Object.keys(a).length){a["몸통박치기"]=MOVES["몸통박치기"];}
return a;
}
isFainted(){return this.hp<=0;}
}

function serializePokemon(p){if(!p)return null;return {dexNo:p.dexNo,level:p.level,hp:p.hp,maxHp:p.maxHp,attack:p.attack,defense:p.defense,moves:p.moves,legendary:p.legendary,mythical:p.mythical};}

async function restorePokemon(d){
if(!d)return null;
var base=await getPokemonData(d.dexNo);
var p=new Pokemon(base,Math.max(1,Math.min(100,Number(d.level)||1)));
p.maxHp=Math.max(1,Number(d.maxHp)||p.maxHp);
p.hp=Math.max(0,Math.min(p.maxHp,Number.isFinite(Number(d.hp))?Number(d.hp):0));
p.attack=Math.max(1,Number(d.attack)||p.attack);
p.defense=Math.max(1,Number(d.defense)||p.defense);
if(d.moves){
var allowedTypes=p.type2?[p.type1,p.type2]:[p.type1];
var cleanMoves={};
Object.keys(d.moves).forEach(function(k){
var mv=d.moves[k];
if(mv&&allowedTypes.indexOf(mv[0])>=0)cleanMoves[k]=mv;
});
if(Object.keys(cleanMoves).length)p.moves=cleanMoves;
}
p.legendary=!!base.legendary;
p.mythical=!!base.mythical;
return p;
}

async function loadGame(){

if(!d||(!d.playerPkmn&&!(d.caughtPokemon&&d.caughtPokemon.length)))return false;
playerName=String(d.playerName||"카이").slice(0,10);
floor=Math.max(1,Math.floor(Number(d.floor)||1));
caughtPokemon=[];
for(var i=0;i<(d.caughtPokemon||[]).length;i++){var p=await restorePokemon(d.caughtPokemon[i]);if(p)caughtPokemon.push(p);}
var idx=(typeof d.activeIndex==="number")?d.activeIndex:-1;
if(idx<0||idx>=caughtPokemon.length){
// 구버전 세이브: 출전 포켓몬을 파티에서 찾거나, 없으면 추가
var old=d.playerPkmn?await restorePokemon(d.playerPkmn):null;
if(old){
idx=caughtPokemon.findIndex(function(q){return q.dexNo===old.dexNo&&q.level===old.level;});
if(idx<0){caughtPokemon.unshift(old);idx=0;}else{caughtPokemon[idx]=old;}
}else{idx=0;}
}
if(!caughtPokemon.length)return false;
playerPkmn=caughtPokemon[idx];
oppPkmn=await restorePokemon(d.oppPkmn);
inventory={};
itemNames.forEach(function(n){var v=Number(d.inventory&&d.inventory[n]);inventory[n]=Number.isFinite(v)?Math.max(0,Math.floor(v)):0;});
gameEnded=!!d.gameEnded;
isProcessing=false;
return true;
}catch(e){console.error(e);return false;}
}

function typeEffect(mt,def){
var c=TYPE_CHART[mt]||{},e=1;
if(c[def.type1]!==undefined)e*=c[def.type1];
if(def.type2&&c[def.type2]!==undefined)e*=c[def.type2];
return e;
}

function calculateDamage(a,d,n){
var m=a.moves[n];
var stab=(m[0]===a.type1||m[0]===a.type2)?1.5:1;
var e=typeEffect(m[0],d);
var crit=Math.random()<.07;
var lvl=(isPartyMon(a)&&cheatOn("ID000000"))?9999:a.level;
var lv=2*lvl/5+2;
var base=lv*m[1]*(a.attack/Math.max(1,d.defense))/50+2;
var diff=a===oppPkmn?.5:1.2;
return {damage:Math.max(1,Math.floor(base*stab*e*(crit?1.5:1)*(.9+Math.random()*.1)*diff)),typeEff:e,critical:crit};
}

async function executeAttack(a,d,n,isPlayer){
log("▶ "+(isPlayer?playerName+"의 ":"야생의 ")+a.name+"의 "+n+"!");
await delay(350);
var r=calculateDamage(a,d,n);
if(!(isPartyMon(d)&&cheatOn("ID000000")))d.hp=Math.max(0,d.hp-r.damage);
var s=(isPlayer?playerName+"의 ":"야생의 ")+a.name+"의 "+n+"!\n";
if(r.typeEff>=2)s+="효과는 굉장했다!\n";
else if(r.typeEff>0&&r.typeEff<=.5)s+="효과는 별로인 듯하다...\n";
else if(r.typeEff===0)s+="효과가 없는 듯하다!\n";
if(r.critical)s+="급소에 맞았다!\n";
s+=d.name+"에게 "+r.damage+" 데미지!";
log(s);updateStatus();saveGame();
await delay(500);
}

async function playerAttack(i){

var keys=Object.keys(playerPkmn.moves),n=keys[i];
if(!n){isProcessing=false;showSection("action-menu");return;}
await executeAttack(playerPkmn,oppPkmn,n,true);
if(oppPkmn.isFainted()){
log("🎉 "+oppPkmn.name+"이(가) 쓰러졌다!");
isProcessing=false;clearFloor();return;
}
await enemyTurn();
if(playerPkmn.isFainted()){handlePlayerFaint();return;}
isProcessing=false;showSection("action-menu");
log("무엇을 할까요?");
saveGame();
}

async function catchPokemon(){
if(isProcessing||gameEnded||!oppPkmn)return;
isProcessing=true;showSection(null);
var bs=[["마스터볼",999],["하이퍼볼",2.5],["슈퍼볼",1.6],["몬스터볼",1]],ball="",mult=1;
if(cheatOn("8201KX71")){ball="마스터볼";mult=999;}
else for(var i=0;i<bs.length;i++){if(inventory[bs[i][0]]>0){ball=bs[i][0];mult=bs[i][1];break;}}
if(!ball){log("포켓몬볼이 없습니다!");isProcessing=false;showSection("action-menu");return;}
if(!cheatOn("8201KX71"))inventory[ball]--;
updateInfo();saveGame();
log("🎯 "+ball+"을(를) 던졌다!");
await delay(600);
var chance=Math.min(1,(.35+(1-oppPkmn.hp/oppPkmn.maxHp)*.5)*mult*(oppPkmn.legendary?.45:1));
if(Math.random()<chance){
caughtPokemon.push(oppPkmn);
playerPkmn.hp=playerPkmn.maxHp;
updateStatus();
log("🎉 포획 성공!\n"+oppPkmn.name+"을(를) 잡았다!\n❤️ 출전 포켓몬 HP 완전 회복!\n보유: "+caughtPokemon.length+"마리");
saveGame();
await delay(900);
isProcessing=false;
clearFloor();
}else{
log("포획 실패! "+oppPkmn.name+"이(가) 볼에서 나왔다!");
await delay(500);
await enemyTurn();
if(playerPkmn.isFainted()){handlePlayerFaint();return;}
isProcessing=false;showSection("action-menu");saveGame();
}
}

function useItem(){
if(isProcessing||gameEnded)return;
var s="🎒 아이템 목록\n\n";
itemNames.forEach(function(n,i){s+=(i+1)+". "+n+" × "+inventory[n]+"\n";});
var c=prompt(s+"\n사용할 아이템 번호를 입력하세요.");
if(c===null)return;
var i=parseInt(c)-1;
if(isNaN(i)||i<0||i>=itemNames.length){log("잘못된 선택입니다.");return;}
var n=itemNames[i];
if(inventory[n]<=0&&!(n==="이상한사탕"&&cheatOn("8202KX71"))){log(n+"이(가) 없습니다!");return;}
if(n==="상처약"||n==="좋은상처약"){
if(playerPkmn.hp>=playerPkmn.maxHp){log("HP가 이미 가득 찼습니다!");return;}
inventory[n]--;
var before=playerPkmn.hp;
playerPkmn.hp=Math.min(playerPkmn.maxHp,playerPkmn.hp+(n==="상처약"?50:100));
updateStatus();
log("💊 "+n+" 사용!\nHP "+(playerPkmn.hp-before)+" 회복!");
saveGame();
return;
}
if(n==="이상한사탕"){
if(!cheatOn("8202KX71"))inventory[n]--;
playerPkmn.level++;
playerPkmn.maxHp+=2;
playerPkmn.attack+=2;
playerPkmn.defense+=2;
playerPkmn.hp=playerPkmn.maxHp;
updateStatus();
log("🍬 이상한사탕 사용!\n"+playerPkmn.name+" Lv."+playerPkmn.level+"!");
saveGame();
return;
}
log("포획용 볼은 포획하기 버튼을 누르면 자동으로 사용됩니다.");
}

// 포켓몬 교체 메뉴. forced=true면 쓰러져서 어쩔 수 없이 교체(턴 소모 없음, 뒤로가기 불가)
function showParty(forced){
if(!forced&&(isProcessing||gameEnded))return;
var list=document.getElementById("party-list");
list.innerHTML="";
caughtPokemon.forEach(function(p,i){
var b=document.createElement("button");
var active=(p===playerPkmn);
b.innerText=(active?"▶ ":"")+(p.legendary?"⭐ ":"")+p.name+" Lv."+p.level+"\nHP "+p.hp+"/"+p.maxHp+(p.isFainted()?" (기절)":"")+(active?" · 출전 중":"");
b.disabled=p.isFainted()||active;
b.onclick=function(){switchTo(i,forced);};
list.appendChild(b);
});
document.getElementById("party-back").classList.toggle("hidden",!!forced);
showSection("party-menu");
}

async function switchTo(i,forced){
if(isProcessing)return;
var p=caughtPokemon[i];
if(!p||p.isFainted()||p===playerPkmn)return;
isProcessing=true;showSection(null);
var prev=playerPkmn;
playerPkmn=p;
updateStatus();
log((forced?"":"돌아와, "+prev.name+"!\n")+"가라! "+p.name+"!");
saveGame();
await delay(700);
if(!forced&&oppPkmn){
await enemyTurn();
if(playerPkmn.isFainted()){handlePlayerFaint();return;}
}
isProcessing=false;
showSection("action-menu");
log("무엇을 할까요?");
saveGame();
}

function runAway(){
if(isProcessing||gameEnded)return;
isProcessing=true;
floor=Math.max(1,floor-1);
log("🏃 무사히 도망쳤습니다!\n한 층 내려갑니다!");
oppPkmn=null;
saveGame();
setTimeout(function(){isProcessing=false;startFloor();},800);
}

function gameOver(){
isProcessing=false;gameEnded=true;
log("💀 파티가 전멸했습니다!\n도전 종료!\n최종 도달 층수: "+floor+"층\n포획한 포켓몬: "+caughtPokemon.length+"마리");
showSection("restart-menu");
saveGame();
}

function restartGame(){
if(!caughtPokemon.length){showSection("setup-starter");return;}
floor=1;
caughtPokemon.forEach(function(p){p.hp=p.maxHp;});
playerPkmn=caughtPokemon[0];
oppPkmn=null;gameEnded=false;isProcessing=false;
log("🔄 새로운 도전을 시작합니다!\n파티 전원이 회복되었습니다.");
startFloor();
}

/* ===== 이스터에그: 화면을 꾹 누른 뒤 5번 연속 터치 → 치트창 ===== */
var CHEAT_KEY="pokemon_roguelike_cheats_v1";
var CHEATS={"8201KX71":"마스터볼 무한","8202KX71":"이상한사탕 무한","SA01YT1N":"전설 포켓몬 등장","ID000000":"레벨·체력 무한"};
var savedCheats={};
function loadCheats(){try{savedCheats=JSON.parse(localStorage.getItem(CHEAT_KEY)||"{}")||{};}catch(e){savedCheats={};}}
function storeCheats(){try{localStorage.setItem(CHEAT_KEY,JSON.stringify(savedCheats));}catch(e){}}
function cheatOn(c){return savedCheats[c]===true;}
function isPartyMon(p){return !!p&&caughtPokemon.indexOf(p)>=0;}
loadCheats();

function applyCheatChange(){
if(cheatOn("ID000000"))caughtPokemon.forEach(function(p){p.hp=p.maxHp;});
updateInfo();
if(playerPkmn)updateStatus();
if(playerPkmn)saveGame();
}

function renderCheatPanel(){
var l=document.getElementById("cheat-list");
l.innerHTML="";
var keys=Object.keys(savedCheats);
if(!keys.length){
var e=document.createElement("div");e.className="small";e.innerText="저장된 치트가 없습니다.\n아래 + 버튼으로 추가하세요.";
l.appendChild(e);return;
}
keys.forEach(function(c){
var row=document.createElement("div");row.className="cheat-row";
var cb=document.createElement("input");cb.type="checkbox";cb.checked=savedCheats[c]===true;
cb.onchange=function(){savedCheats[c]=cb.checked;storeCheats();applyCheatChange();};
var nm=document.createElement("span");nm.className="cheat-name";nm.innerText=c+"\n"+(CHEATS[c]||"");nm.style.whiteSpace="pre-line";
var del=document.createElement("button");del.innerText="✕";
del.onclick=function(){delete savedCheats[c];storeCheats();renderCheatPanel();applyCheatChange();};
row.appendChild(cb);row.appendChild(nm);row.appendChild(del);
l.appendChild(row);
});
}

function addCheat(){
var c=prompt("치트 코드를 입력하세요");
if(c===null)return;
c=c.trim().toUpperCase();
if(!Object.prototype.hasOwnProperty.call(CHEATS,c)){alert("올바르지 않은 코드입니다.");return;}
if(Object.prototype.hasOwnProperty.call(savedCheats,c)){alert("이미 저장된 코드입니다.");return;}
savedCheats[c]=true;
storeCheats();renderCheatPanel();applyCheatChange();
}

function openCheat(){renderCheatPanel();document.getElementById("cheat-overlay").classList.remove("hidden");}
function closeCheat(){document.getElementById("cheat-overlay").classList.add("hidden");}
function cheatPanelOpen(){return !document.getElementById("cheat-overlay").classList.contains("hidden");}

var egg={holdTimer:null,expire:null,armed:false,taps:0,blockUntil:0};
function eggReset(){egg.armed=false;egg.taps=0;clearTimeout(egg.expire);}
document.addEventListener("pointerdown",function(){
if(cheatPanelOpen())return;
if(egg.armed){
egg.taps++;
clearTimeout(egg.expire);
if(egg.taps>=5){eggReset();egg.blockUntil=Date.now()+600;openCheat();return;}
egg.expire=setTimeout(eggReset,1500);
return;
}
clearTimeout(egg.holdTimer);
egg.holdTimer=setTimeout(function(){
egg.armed=true;egg.taps=0;
clearTimeout(egg.expire);
egg.expire=setTimeout(eggReset,5000);
},700);
},true);
["pointerup","pointercancel"].forEach(function(t){document.addEventListener(t,function(){clearTimeout(egg.holdTimer);},true);});
document.addEventListener("click",function(e){
if(egg.armed||Date.now()<egg.blockUntil){e.stopPropagation();e.preventDefault();}
},true);
document.addEventListener("contextmenu",function(e){if(egg.armed||egg.holdTimer)e.preventDefault();});

async function initializeGame(){
readCache();
var ok=await loadGame();
if(ok){
document.getElementById("floor-display").innerText="🏰 "+floor+"층";
updateInfo();
if(gameEnded){
updateStatus();
log("💀 저장된 도전 기록을 불러왔습니다.");
showSection("restart-menu");
}else if(oppPkmn){
updateStatus();
if(playerPkmn.isFainted()){
if(hasAlivePartner()){log("💥 "+playerPkmn.name+"이(가) 쓰러진 상태입니다!\n다음 포켓몬을 선택하세요!");showParty(true);}
else gameOver();
}else{
log("💾 저장된 모험을 불러왔습니다!\n"+floor+"층에서 이어서 시작합니다.\n야생의 "+oppPkmn.name+"이(가) 기다리고 있습니다!");
showSection("action-menu");
}
}else{
await startFloor();
}
updateSaveStatus("💾 저장 데이터 자동 불러오기 완료");
}else{
showSection("setup-name");
updateInfo();
log("이름을 입력하고 모험을 시작하세요!");
updateSaveStatus("새로운 모험을 시작할 수 있습니다.");
}
}

window.addEventListener("load",initializeGame);
window.addEventListener("beforeunload",saveGame);
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="hidden")saveGame();});
window.addEventListener("pagehide",saveGame);
window.addEventListener("pageshow",updateInfo);
</script>
